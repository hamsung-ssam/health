<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보듬이 – 보건실 건강사정 도우미</title>
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1B2426; --muted:#45524F; --line:#D8D2C6; --soft:#EEEAE2;
  --pri:#0C6560; --pri-dark:#084B47; --pri-soft:#E1F0EE;
  --red:#B42318; --red-soft:#FDECEA; --amber:#8A4300; --amber-soft:#FFF1DC;
  --green:#0F6236; --green-soft:#E5F4EA; --purple:#563AA6; --purple-soft:#EEE8FB;
  --focus:#1D4ED8; --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Noto Sans SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{line-height:1.3;margin:0 0 .5em}
p{margin:0 0 .6em}
ul{margin:.2em 0 .6em;padding-left:1.3em}
li{margin:.15em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--pri-dark);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.5px}
.brand svg{flex:none}
.mode{font-size:16px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:999px}
.topbar .sp{flex:1}
.topbar .btn{min-height:48px;background:#fff;color:var(--pri-dark);border-color:#fff}
.topbar .btn.lock{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.narrow{max-width:980px;margin:0 auto}
.banner{max-width:1240px;margin:12px auto 0;padding:0 20px}
.banner div{background:var(--amber-soft);border:2px solid #E7B26A;color:#5A2C00;border-radius:12px;padding:10px 16px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 22px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-align:center;line-height:1.3;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--pri)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-dark)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.big{min-height:64px;font-size:22px;padding:10px 28px}
.btn.sm{min-height:48px;font-size:17px;padding:6px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{font-size:23px}
.card h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:16px}
.src{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.tag{display:inline-block;font-size:15px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);margin:2px 4px 2px 0}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}

/* home */
.hero{text-align:center;padding:18px 0 8px}
.hero h1{font-size:clamp(30px,4vw,42px);margin-bottom:6px}
.howto{background:#fff;border:2px solid var(--pri);border-radius:var(--radius);padding:16px 20px;max-width:760px;margin:12px auto 26px;text-align:left;font-size:20px}
.howto b{color:var(--pri-dark)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:1000px;margin:0 auto}
.homebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;border-radius:22px;border:3px solid var(--line);background:#fff;cursor:pointer;padding:20px;font-weight:800;font-size:26px;box-shadow:var(--shadow);touch-action:manipulation}
.homebtn .ic{font-size:60px;line-height:1}
.homebtn .sub{font-size:17px;font-weight:600;color:var(--muted)}
.homebtn.stu{border-color:var(--pri);background:var(--pri-soft)}
.homebtn:hover{border-color:var(--pri-dark)}
.notice{max-width:1000px;margin:22px auto 0;font-size:16px;color:var(--muted);text-align:center}

/* student */
.stu{max-width:1000px;margin:0 auto}
.progress{display:flex;gap:6px;margin:4px 0 14px}
.progress span{flex:1;height:10px;border-radius:99px;background:var(--soft)}
.progress span.on{background:var(--pri)}
.qhead{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.q{font-size:clamp(26px,3.4vw,34px);font-weight:800;margin:0;line-height:1.3}
.listen{min-height:56px;font-size:20px;background:#FFF8E6;border-color:#E3B341}
.novoice{background:#FFF8E6;border:2px dashed #E3B341;border-radius:12px;padding:8px 14px;font-weight:600;margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:136px;padding:16px 12px;border-radius:20px;border:3px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:21px;text-align:center;line-height:1.3;touch-action:manipulation}
.choice .em{font-size:52px;line-height:1}
.choice[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(12,101,96,.18)}
.choice[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.choice.danger{border-color:#E9A39C}
.choice.danger[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.choice.danger[aria-pressed="true"]::after{background:var(--red)}
.choice.none{border-style:dashed}
.navbar{display:flex;gap:14px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.navbar .btn{min-width:150px;min-height:64px;font-size:22px}
.hint{color:var(--red);font-weight:700;margin-top:10px;min-height:1.6em}
.langgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.langbtn{min-height:120px;font-size:30px;font-weight:800;border-radius:20px;border:3px solid var(--line);background:#fff;cursor:pointer}
.langbtn:hover{border-color:var(--pri)}
.langtitle{text-align:center;font-size:22px;font-weight:700;color:var(--muted);margin-bottom:14px;line-height:1.5}

.bodywrap{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:20px;align-items:start}
.bodybox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px}
.bodybox svg{width:100%;height:auto;max-height:62vh;display:block;margin:0 auto}
.viewtoggle{display:flex;gap:10px;margin-bottom:10px}
.viewtoggle .btn{flex:1}
.viewtoggle .btn[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.part{cursor:pointer}
.part .shp{stroke-width:2;transition:fill .12s}
.part .shp.skin{fill:#F7D7BE;stroke:#B98767}
.part .shp.shirt{fill:#9CCBEA;stroke:#5E7590}
.part .shp.pants{fill:#5B6F9A;stroke:#3D4C6E}
.part .shp.shoe{fill:#3E4C63;stroke:#263142}
.part:hover .shp{filter:brightness(1.07)}
.part.sel .shp{fill:#FF8F6B;stroke:#A9341A;stroke-width:3;filter:none}
.part:focus{outline:none}
.part:focus-visible .shp{stroke:var(--focus);stroke-width:5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:4px 14px;border-radius:999px;background:var(--pri-soft);border:2px solid var(--pri);font-weight:700}
.chip.x{cursor:pointer}
.facegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.facegrid .choice{min-height:170px;font-size:19px}
.facegrid svg{width:76px;height:76px}

.stopbox{background:var(--red-soft);border:4px solid var(--red);border-radius:24px;padding:28px;text-align:center;animation:pulse 1.6s ease-in-out infinite}
.stopbox h1{color:var(--red);font-size:clamp(32px,5vw,48px)}
.stopbox p{font-size:24px;font-weight:700}
/* 배 9구역 확대판 */
.bellybox{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px}
.bellyside{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);padding:0 8px 4px}
.bellygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#E9D3BE;border:3px solid #7E604A;border-radius:34px;padding:8px;max-width:330px;margin:0 auto}
.bcell{min-height:76px;border:2px solid #C9AD94;background:#F3E1CF;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.bcell:hover{background:#FBEBDD}
.bcell[aria-pressed="true"]{background:#FF8F6B;border-color:#A9341A;box-shadow:inset 0 0 0 2px #A9341A}
.bcell[aria-pressed="true"]::after{content:"✓";color:#fff;font-weight:800;font-size:24px}
.navel{width:12px;height:12px;border-radius:50%;background:#7E604A}
.bcell[aria-pressed="true"] .navel{display:none}
.part .shp.cell{stroke:#7FA6C6;stroke-width:1.2}
.part.sel .shp.cell{stroke:#A9341A;stroke-width:2}
/* 증상 줄 배열 */
.gch{font-size:22px;margin:0 0 10px;color:var(--pri-dark)}
.gcgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.gcgrid.g6{grid-template-columns:repeat(6,1fr)}
.gcb{min-height:72px;font-size:22px;padding:8px 4px}
.gcb[aria-pressed="true"]{background:var(--pri);border-color:var(--pri-dark);color:#fff}
.gcb[aria-pressed="true"]::after{width:26px;height:26px;font-size:15px;top:-9px;right:-9px;background:var(--pri-dark);border:2px solid #fff}
.choices.four{grid-template-columns:repeat(4,1fr)}
.foldhead{cursor:pointer;user-select:none;-webkit-user-select:none;min-height:48px;flex-wrap:wrap;border-radius:12px;margin:-6px -8px 10px;padding:6px 8px}
.foldhead:hover{background:var(--soft)}
.foldhead.forced{cursor:default}.foldhead.forced:hover{background:none}
.foldhead .chev{margin-left:auto;font-size:16px;font-weight:800;color:var(--pri-dark);background:var(--pri-soft);border-radius:999px;padding:4px 12px;white-space:nowrap}
.foldhead .fpin{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
.fbadge{font-size:15px;font-weight:700;background:var(--soft);border-radius:999px;padding:2px 12px;color:var(--ink)}
.card.folded{padding-top:14px;padding-bottom:14px}
.card.folded>.foldhead{margin-bottom:-6px}
.card.folded>:not(.foldhead){display:none !important}
.symrows{display:grid;gap:14px}
.symrow{display:grid;gap:14px}
.symrow.n3{grid-template-columns:repeat(3,1fr)}
.symrow.n4{grid-template-columns:repeat(4,1fr)}
/* 통증 척도 */
.facegrid.six{grid-template-columns:repeat(6,1fr)}
.painbtn{padding-top:46px}
.pscore{position:absolute;top:8px;left:50%;transform:translateX(-50%);min-width:44px;padding:0 10px;border-radius:999px;color:#fff;font-weight:800;font-size:20px;line-height:30px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.painbtn[aria-pressed="true"]::after{top:6px;right:6px}
.gaugewrap{margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.gauge{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:6px}
.gauge span{height:12px;border-radius:4px}
.gauge.big span{height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,.35)}50%{box-shadow:0 0 0 14px rgba(180,35,24,0)}}
@media (prefers-reduced-motion:reduce){.stopbox{animation:none}}
.donebox{background:var(--green-soft);border:3px solid var(--green);border-radius:24px;padding:30px;text-align:center}
.donebox h1{color:var(--green);font-size:clamp(28px,4vw,40px)}
.adultnote{margin-top:16px;font-size:17px;color:var(--muted);font-weight:600}

/* teacher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--line)}
.tab{min-height:52px;padding:8px 20px;border:none;background:none;font-weight:800;font-size:19px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--pri-dark);border-bottom-color:var(--pri)}
.pending{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pending .btn[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.tgrid{display:block}
@media (min-width:768px){.toprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}}
@media (min-width:1024px){
  .tgrid{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
  .aside{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
}
.sumtbl{width:100%;border-collapse:collapse;font-size:17px}
.sumtbl th{text-align:left;white-space:nowrap;color:var(--muted);font-weight:700;padding:6px 10px 6px 0;vertical-align:top;width:6.5em}
.sumtbl td{padding:6px 0;border-bottom:1px solid var(--soft)}
.alert{border-radius:14px;padding:12px 16px;margin:10px 0;font-weight:600;border:2px solid}
.alert.red{background:var(--red-soft);border-color:var(--red);color:#7A150D}
.alert.amber{background:var(--amber-soft);border-color:#E7A55A;color:#5A2C00}
.alert.info{background:#EEF4FF;border-color:#9BB6EA;color:#183B7A}
.alert.purple{background:var(--purple-soft);border-color:var(--purple);color:#2E1B66}
.alert.green{background:var(--green-soft);border-color:var(--green);color:#0B4426}
.sec{display:flex;align-items:center;gap:10px}
.sec .num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 10px;border-radius:12px;cursor:pointer}
.chk:hover{background:var(--soft)}
.chk input{width:26px;height:26px;flex:none;margin-top:3px;accent-color:var(--pri)}
.tier{border-left:6px solid;padding:6px 0 6px 12px;margin:10px 0;border-radius:4px}
.tier.E{border-color:var(--red)}
.tier.U{border-color:#D9822B}
.tier.N{border-color:var(--green)}
.tier .tl{font-weight:800;font-size:17px}
.tier.E .tl{color:var(--red)} .tier.U .tl{color:var(--amber)} .tier.N .tl{color:var(--green)}
.sevgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.sev{min-height:96px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;padding:12px;text-align:left}
.sev b{display:block;font-size:21px}
.sev span{font-size:16px;color:var(--muted)}
.sev.s1[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.sev.s2[aria-pressed="true"]{border-color:#D9822B;background:var(--amber-soft)}
.sev.s3[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.rec{border-radius:14px;padding:14px 16px;border:2px dashed var(--line);background:#FBFAF7}
.carelist{counter-reset:c;list-style:none;padding:0}
.carelist li{counter-increment:c;position:relative;padding:6px 0 6px 40px}
.carelist li::before{content:counter(c);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
details{border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:10px 0;background:#FBFAF7}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.letter{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.letter.two{grid-template-columns:1fr 1fr}}
.lpage{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;font-size:17px}
.lpage h3{font-size:20px;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:8px}
.lpage h4{font-size:17px;margin:12px 0 4px;color:var(--pri-dark)}
.lpage .em{border:2px solid var(--red);border-radius:8px;padding:6px 10px;font-weight:700;color:#7A150D;margin-top:10px}
.lock{background:var(--purple-soft);border:2px solid var(--purple);border-radius:16px;padding:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px}
.field label{font-weight:700;font-size:17px}
.field input,.field select,.field textarea{min-height:52px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-size:19px}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(12,101,96,.2)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:8em 1fr 3em;gap:10px;align-items:center;font-size:17px}
.bar .tr{height:22px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--pri);border-radius:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700}
.tblwrap{overflow-x:auto}
.kpi{font-size:34px;font-weight:800;color:var(--pri-dark)}

/* modal & toast */
.modalbg{position:fixed;inset:0;background:rgba(10,20,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h2{font-size:24px}
.pinin{font-size:34px !important;letter-spacing:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2426;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#printArea{display:none}

@media (min-width:641px) and (max-width:900px){.gcgrid{grid-template-columns:repeat(5,1fr)}.facegrid.six{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){
  body{font-size:18px}
  .wrap{padding:16px 12px 50px}
  .card{padding:16px}
  .topbar .in{padding:8px 12px}
  .brand{font-size:21px}
  .choices{grid-template-columns:repeat(2,1fr);gap:10px}
  .choice{min-height:124px;font-size:19px;padding:12px 8px}
  .choice .em{font-size:44px}
  .bodywrap{grid-template-columns:1fr}
  .bodybox svg{max-height:none}
  .facegrid,.facegrid.six{grid-template-columns:repeat(3,1fr)}
  .choices.four{grid-template-columns:repeat(2,1fr)}
  .gcgrid{grid-template-columns:repeat(5,1fr);gap:8px}
  .gcgrid.g6{grid-template-columns:repeat(3,1fr)}
  .gcb{min-height:60px;font-size:18px}
  .gauge.big span{height:32px;font-size:14px}
  .symrows,.symrow{gap:8px}
  .symrow .choice{min-height:118px;font-size:16px;padding:10px 4px;border-radius:16px}
  .symrow .choice .em{font-size:38px}
  .symrow.n4 .choice{font-size:14.5px;padding:10px 2px}

var voiceMissing={};
function hasSpeech(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';}
function findVoice(code){if(!hasSpeech())return null;var vs=[];try{vs=window.speechSynthesis.getVoices()||[];}catch(e){}if(!vs.length)return undefined;
  var tts=langInfo(code).tts.toLowerCase();var pre=code.toLowerCase();var best=null;
  for(var i=0;i<vs.length;i++){var vl=String(vs[i].lang||'').replace('_','-').toLowerCase();if(vl===tts)return vs[i];if(!best&&vl.indexOf(pre)===0)best=vs[i];}return best;}
function speak(text,code){
  if(!hasSpeech()){voiceMissing[code]=true;render();return;}
  var v=findVoice(code);
  if(v===null){voiceMissing[code]=true;render();return;}
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=langInfo(code).tts;if(v)u.voice=v;u.rate=0.9;
    u.onerror=function(){};window.speechSynthesis.speak(u);}catch(e){voiceMissing[code]=true;render();}
}
if(hasSpeech()){try{window.speechSynthesis.onvoiceschanged=function(){};window.speechSynthesis.getVoices();}catch(e){}}

function warnings(c){
  var w=[],P=c.parts,S=c.syms,has=function(a,x){return a.indexOf(x)>=0;};
  var injury=['fall','sport','other'].indexOf(c.cause)>=0;
  var anyPart=function(b){for(var i=0;i<P.length;i++)if(partGroup(P[i])===b)return true;return false;};
  if(c.emerg.length)w.push(['red','학생이 응급 징후를 골랐어요: '+c.emerg.map(function(e){return findBy(EMERG,e).k;}).join(', ')+' → ① 응급 징후 확인부터 하세요.']);
  if((anyPart('head')||has(S,'headache'))&&injury)w.push(['amber','머리를 부딪혔을 가능성 → 구토·의식 변화·경련 여부 확인(머리 손상)']);
  if(has(S,'stomach')&&has(S,'fever')&&(has(S,'vomit')||has(S,'diarrhea')))w.push(['amber','복통·발열·구토(설사)가 함께 있음 → 긴급 사정 필요']);
  if(has(S,'fever')&&has(S,'headache')&&anyPart('neck'))w.push(['amber','발열·두통·목 통증 → 목 경직 여부 확인']);
  if(has(P,'b_rl')&&(has(S,'stomach')||painVal(c)>=6))w.push(['amber','오른쪽 아랫배 통증 → 통증 이동(배꼽 주위→오른쪽 아래)·발열·구토 여부 확인, 지속되면 병원 진료 의뢰']);
  if(anyPart('belly')&&!has(S,'stomach')&&c.syms.length)w.push(['info','배 부위를 골랐어요 → 복통 체크리스트가 필요하면 [증상 추가·변경]에서 복통을 추가하세요.']);
  var ST=stypeOf(c);
  if(has(ST,'sudden')&&painVal(c)>=8)w.push(['amber','갑작스럽고 심한 복통 → 극심한 복통 징후(얼굴 창백·빈맥·식은땀) 확인']);
  if(has(ST,'move'))w.push(['amber','움직이거나 누르면 더 아픈 복통 → 반발통·복부 팽만·강직 여부 확인']);
  if(has(ST,'constant')&&(c.when==='yday'||c.when==='long'))w.push(['amber','하루 이상 계속되는 복통 → 발열·구토·설사 동반 여부 확인, 병원 진료 고려']);
  if(has(ST,'burn'))w.push(['info','속쓰림 호소 → 식사 여부·식습관 확인']);
  if(has(ST,'gurgle'))w.push(['info','부글거림 호소 → 설사·가스·최근 먹은 음식 확인']);
  var MD=medOf(c);
  if(has(MD,'today'))w.push(['amber','오늘 약을 먹고 등교 → 약 이름·복용 시각을 확인하고, 보건실 투약 시 같은 성분 중복에 주의']);
  if(has(MD,'daily'))w.push(['info','매일 복용하는 약 있음 → 약 이름·복용 이유(관리 중인 질환) 확인, 건강조사서·요양호 학생 명단 대조']);
  if(c.hosp==='yes')w.push(['info','이번 증상으로 병원 진료 받음 → 진료 결과·처방·학교생활 주의사항을 학생·보호자에게 확인']);
  if(anyPart('chest'))w.push(['amber','가슴 부위 통증 → 흉통 양상·지속 시간 확인']);
  if(has(S,'eye')&&injury)w.push(['amber','눈 외상 가능성 → 시력 변화·복시 확인, 안과 진료 고려']);
  if(has(S,'tooth')&&injury)w.push(['amber','치아 외상 → 영구치 여부 확인(빠진 영구치는 30분 이내 치과)']);
  if(has(S,'bite'))w.push(['info','벌레 물림 → 전신 두드러기·호흡곤란 여부 확인']);
  if(painVal(c)>=8)w.push(['amber','통증 '+painVal(c)+'/10 ('+painLabel(painVal(c))+') 호소 → 재사정 권장']);
  if(c.when==='yday'||c.when==='long')w.push(['info','증상이 하루 이상 지속 → 경과·복약 여부 확인']);
  return w;
}
function recommend(c){
  var r=[],lvl=3,basis=false,t=c.t;
  if(c.emerg.length){lvl=1;basis=true;r.push('학생 응답 응급 징후: '+c.emerg.map(function(e){return findBy(EMERG,e).k;}).join(', '));}
  t.g.forEach(function(id){var g=findBy(GE,id);if(g){lvl=1;basis=true;r.push('응급 징후: '+g.k);}});
  c.syms.forEach(function(sid){var s=symById(sid);if(!s)return;(t.ck[sid]||[]).forEach(function(key){var p=key.split(':'),tier=p[0],txt=(s[tier]||[])[+p[1]];if(!txt)return;basis=true;
    if(tier==='E'){lvl=1;r.push('['+s.k+'] 응급: '+txt);}else if(tier==='U'){if(lvl>2)lvl=2;r.push('['+s.k+'] 긴급: '+txt);}});});
  var tp=parseFloat(t.temp);if(!isNaN(tp)){basis=true;if(tp>=40){lvl=1;r.push('체온 '+tp+'℃ (40℃ 이상)');}else if(tp>=38){if(lvl>2)lvl=2;r.push('체온 '+tp+'℃ (38℃ 이상)');}}
  return {lvl:lvl,reasons:r,basis:basis};
}

function stuNext(){

  if(need){state.hint=(c.step==='body'||c.step==='sym'||c.step==='stype'||c.step==='med')?tt.pickOne:(c.step==='gc'?tt.qGc:tt.pickOneSingle);state.keepScroll=true;render();return;}

function pinSetup(role){

  if(ag&&!validPin(ag)){msg.textContent='업무대행자 PIN도 숫자 4자리로 적어 주세요.';return;}
  if(ag&&ag===a){msg.textContent='업무대행자 PIN은 보건교사 PIN과 다르게 정해 주세요.';return;}
  var s=settings();s.pinT=hashPin(a);s.pinA=ag?hashPin(ag):'';store.set('settings',s);closeModal();openView(role);toast('PIN을 정했어요. 잊지 않도록 따로 적어 두세요.');

  var msg=$('#pinMsg'),p=($('#pin')||{}).value||'',s=settings();
  if(Date.now()<pinFail.until){msg.textContent='여러 번 틀렸어요. '+Math.ceil((pinFail.until-Date.now())/1000)+'초 뒤에 다시 해 주세요.';return;}
  if(!validPin(p)){msg.textContent='숫자 4자리를 적어 주세요.';return;}
  var hp=hashPin(p),ok=false,as=role;
  if(hp===s.pinT){ok=true;}else if(role==='agent'&&s.pinA&&hp===s.pinA){ok=true;}
  if(role==='teacher'&&hp!==s.pinT)ok=false;
  if(!ok){pinFail.n++;if(pinFail.n>=5){pinFail.until=Date.now()+30000;pinFail.n=0;}msg.textContent='PIN이 맞지 않아요.';$('#pin').value='';$('#pin').focus();return;}
  pinFail.n=0;closeModal();openView(as);
}
function openView(role){
  state.auth=role;state.view=role;state.tab='case';
  var c=state.sid&&getCase(state.sid);if(c)state.tid=c.id;state.sid=null;
  if(hasSpeech()){try{window.speechSynthesis.cancel();}catch(e){}}
  render();
}
function savePins(){
  var s=settings(),o=$('#aOld').value,nt=$('#aNewT').value,na=$('#aNewA').value;
  if(hashPin(o)!==s.pinT){toast('지금 보건교사 PIN이 맞지 않아요.');return;}
  if(!nt&&!na){toast('바꿀 PIN을 적어 주세요.');return;}
  if(nt&&!validPin(nt)){toast('새 보건교사 PIN은 숫자 4자리로 적어 주세요.');return;}
  if(na&&!validPin(na)){toast('업무대행자 PIN은 숫자 4자리로 적어 주세요.');return;}
  var finalT=nt||o;if(na&&na===finalT){toast('업무대행자 PIN은 보건교사 PIN과 달라야 해요.');return;}
  if(nt)s.pinT=hashPin(nt);if(na)s.pinA=hashPin(na);store.set('settings',s);state.keepScroll=true;render();toast('PIN을 저장했어요.');
}
function saveLog(){
  var c=getCase(state.tid);if(!c)return;var t=c.t;
  if(t.saved){toast('이미 저장했어요.');return;}
  var g=parseInt(t.grade,10),cl=parseInt(t.cls,10),no=parseInt(t.no,10);
  if(!(g>=1&&g<=6)){toast('학년을 골라 주세요.');return;}
  if(!(cl>=1&&cl<=30)){toast('반은 1~30 사이 숫자로 적어 주세요.');return;}
  if(!(no>=1&&no<=50)){toast('번호는 1~50 사이 숫자로 적어 주세요.');return;}
  if(!c.syms.length){toast('증상을 하나 이상 골라 주세요.');return;}
  if(!t.sev){toast('③ 중증도 최종 판단을 먼저 골라 주세요.');return;}
  var L_=logs();if(L_.some(function(r){return r.id===c.id;})){t.saved=true;putCase(c);render();toast('이미 저장된 기록이에요.');return;}
  L_.push({id:c.id,ts:c.created,g:String(g),cl:String(cl),no:String(no),parts:c.parts.map(partKo),syms:c.syms.slice(),stype:stypeOf(c).slice(),pain10:painVal(c),hosp:c.hosp,med:medOf(c).slice(),when:c.when,sev:t.sev,acts:t.acts.slice(),emerg:!!(c.emerg.length||t.g.length),protect:isProtect(c),unlock:!!t.unlock});
  if(!store.set('logs',L_))return;
  t.saved=true;putCase(c);state.keepScroll=true;render();toast('보건일지에 저장했어요.');
}
function csvCell(v){var s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function downloadBlob(name,text,type){
  try{var blob=new Blob([text],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);toast('파일을 내려받았어요.');}
  catch(e){toast('이 환경에서는 내려받기가 안 돼요.');}
}
function downloadCSV(){
  var rows=[['문진 날짜','문진 시각','확인 완료','학년','반','문진 언어','응급 징후(학생)','응급 징후(교사 확인)','아픈 곳','증상','복통 양상','아픈 정도(0~10)','시작','원인','병원 진료','복용 중인 약','체온','응급 체크','긴급 체크','추천 단계','최종 중증도','학교 조치','보호 필요','안내문 열람 판단']];
  records().forEach(function(r){var pv=painVal(r),rc=recommend(r);
    rows.push([fmtDate(r.created),fmtTime(r.created),r.done?fmtDate(r.done)+' '+fmtTime(r.done):'',r.t.grade||'',r.t.cls||'',r.student?langInfo(r.lang).kname:'교사 직접 기록',
      r.emerg.map(function(e){return findBy(EMERG,e).k;}).join(' / '),r.t.g.map(function(g){return findBy(GE,g).k;}).join(' / '),
      r.parts.map(partKo).join(' / '),r.syms.map(function(x){return symById(x)?symById(x).k:x;}).join(' / '),stypeOf(r).map(function(x){return findBy(STYPE,x).k;}).join(' / '),
      pv===null?'':pv,r.when?findBy(WHEN,r.when).k:'',r.cause?findBy(CAUSE,r.cause).k:'',hospText(r),medOf(r).map(function(x){return findBy(MEDQ,x).k;}).join(' / '),r.t.temp||'',
      ckList(r,'E').join(' / '),ckList(r,'U').join(' / '),rc.basis?rc.lvl:'',r.t.sev?r.t.sev+'단계 '+SEV[r.t.sev].n:'',
      r.t.acts.map(function(a){return findBy(ACTS,a).ko.replace(/\.$/,'');}).join(' / '),isProtect(r)?'예':'',r.t.unlock?'관리자 보고 후 열람':'']);});
  var csv='﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
  downloadBlob('보듬이_기록_'+fmtDate(Date.now())+'.csv',csv,'text/csv;charset=utf-8');
}
function printLetter(){
  var c=getCase(state.tid);if(!c||!c.syms.length)return;if(isProtect(c)&&!c.t.unlock){toast('보호 필요 학생은 안내문이 잠겨 있어요.');return;}
  var ll=letterLang(c),s=settings();
  $('#printArea').innerHTML='<div class="letter '+(ll?'':'one')+'">'+letterHTML(c,'ko',c.t.acts,s.school)+(ll?letterHTML(c,ll,c.t.acts,s.school):'')+'</div>';
  try{window.print();}catch(e){toast('이 환경에서는 인쇄가 안 돼요. [글 복사하기]를 써 주세요.');}
}
function copyLetter(){
  var c=getCase(state.tid);if(!c||!c.syms.length)return;if(isProtect(c)&&!c.t.unlock){toast('보호 필요 학생은 안내문이 잠겨 있어요.');return;}
  var ll=letterLang(c),s=settings(),txt=letterText(c,'ko',c.t.acts,s.school)+(ll?'\n\n────────\n\n'+letterText(c,ll,c.t.acts,s.school):'');
  var done=function(){toast('안내문 글을 복사했어요. 알림앱에 붙여 넣으세요.');};
  var fallback=function(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(ok)done();else toast('복사가 안 되는 환경이에요. 인쇄를 이용해 주세요.');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fallback);}else fallback();
}
function openReport(area){
  openModal('<h2>⚑ 오류 신고</h2><div class="field"><label for="rArea">어느 부분인가요?</label><input id="rArea" type="text" maxlength="60" value="'+esc(area)+'"></div>'+
   '<div class="field" style="margin-top:10px"><label for="rText">무엇이 잘못되었나요? (학생 이름 등 개인정보는 적지 마세요)</label><textarea id="rText" maxlength="500"></textarea></div>'+
   '<div class="row end" style="margin-top:14px"><button class="btn" data-act="modalClose">취소</button><button class="btn pri" data-act="saveReport">저장</button></div>');
  var tx=$('#rText');if(tx)tx.focus();
}
function saveReport(){
  var area=String(($('#rArea')||{}).value||'').trim().slice(0,60),text=String(($('#rText')||{}).value||'').trim().slice(0,500);
  if(!text){toast('내용을 적어 주세요.');return;}
  var r=store.get('reports',[]);r.push({ts:Date.now(),area:area||'기타',text:text});store.set('reports',r);closeModal();state.keepScroll=true;render();toast('오류 신고를 저장했어요. [관리]에서 내려받을 수 있어요.');
}
function downloadReports(){var r=store.get('reports',[]);if(!r.length)return;
  var txt='보듬이 오류 신고 목록 ('+fmtDate(Date.now())+')\r\n\r\n'+r.map(function(x,i){return (i+1)+'. ['+fmtDate(x.ts)+' '+fmtTime(x.ts)+'] '+x.area+'\r\n   '+x.text.replace(/\n/g,'\r\n   ');}).join('\r\n\r\n');
  downloadBlob('보듬이_오류신고_'+fmtDate(Date.now())+'.txt','﻿'+txt,'text/plain;charset=utf-8');}

/* 10분 동안 조작이 없으면 교사·대행자 화면 자동 잠금 */
setInterval(function(){if(state.auth&&Date.now()-state.lastInput>10*60*1000){state.auth=null;closeModal();goHome();toast('10분 동안 사용하지 않아 화면을 잠갔어요.');}},20000);

/* 시작 */
(function init(){
  if(!store.ok)$('#storeBanner').hidden=false;
  render();
})();
</script>
